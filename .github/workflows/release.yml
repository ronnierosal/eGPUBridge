name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Verify reproducible plugin build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build:check
          pnpm check:frontend-contract
          pnpm smoke:bundle
          pnpm check:package

      - name: Create plugin zip
        run: |
          zip -r eGPUBridge-${{ github.ref_name }}.zip \
            dist/ \
            src/ \
            scripts/ \
            docs/ \
            main.py \
            package.json \
            pnpm-lock.yaml \
            plugin.json \
            rollup.config.js \
            tsconfig.json \
            bin/ \
            LICENSE \
            README.md
          sha256sum eGPUBridge-${{ github.ref_name }}.zip > eGPUBridge-${{ github.ref_name }}.zip.sha256

      - name: Create release and upload verified artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/index.js
            main.py
            package.json
            plugin.json
            LICENSE
            README.md
            eGPUBridge-${{ github.ref_name }}.zip
            eGPUBridge-${{ github.ref_name }}.zip.sha256
          fail_on_unmatched_files: true
